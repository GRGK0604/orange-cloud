# 自动构建 Android OSS APK（productFlavor: oss）
# - push / PR 变更 apps/android 时构建并上传 Artifact
# - 打 tag（android-oss-v* 或 v*）时额外挂到 GitHub Release
# - 也可在 Actions 页手动触发；可选填 OAUTH_CLIENT_ID

name: Build OSS APK

on:
  push:
    branches: [main, master]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-oss.yml"
    tags:
      - "android-oss-v*"
      - "v*"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-oss.yml"
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "可选：覆盖 OAUTH_CLIENT_ID（默认注入官方 Client ID）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble ossRelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目 gradle-daemon-jvm.properties 要求 JetBrains JBR 21；
      # CI 上该文件无 toolchainUrl，无法自动下载。安装 Temurin 21 供 Gradle 使用。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 缓存 ~/.gradle（Wrapper、依赖、构建缓存）。主分支可写，PR/其它分支只读。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/android
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 缓存 API 36 / build-tools，命中则跳过 sdkmanager 下载
      - name: Cache Android SDK packages
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/platform-tools
          key: android-sdk-${{ runner.os }}-api36-bt36.0.0
          restore-keys: |
            android-sdk-${{ runner.os }}-api36-

      - name: Install SDK packages
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Write local.properties
        env:
          # 默认注入官方 PKCE Client ID（源码 play 风味同值）；手动运行 / Secrets 可覆盖
          INPUT_OAUTH_CLIENT_ID: ${{ inputs.oauth_client_id }}
          SECRET_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          DEFAULT_OAUTH_CLIENT_ID: 102240eb9095a1965ee11813ef4788cd
        run: |
          oauth_id="${INPUT_OAUTH_CLIENT_ID:-}"
          if [ -z "$oauth_id" ]; then oauth_id="${SECRET_OAUTH_CLIENT_ID:-}"; fi
          if [ -z "$oauth_id" ]; then oauth_id="$DEFAULT_OAUTH_CLIENT_ID"; fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "OAUTH_CLIENT_ID=$oauth_id"
          } > local.properties

      # 去掉 Daemon JVM 自动下载约束，改用上面 setup-java 的 JAVA_HOME。
      # （本地仍保留 gradle-daemon-jvm.properties，不影响 Android Studio）
      - name: Relax Gradle daemon JVM criteria for CI
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Build OSS release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOssRelease --stacktrace --build-cache

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/oss/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$src" ]; then
            echo "::error::未找到 oss release APK"
            exit 1
          fi

          version_name="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/')"
          out="orange-cloud-oss-${version_name}-${version_code}.apk"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$src" "$GITHUB_WORKSPACE/dist/$out"

          {
            echo "path=dist/$out"
            echo "name=$out"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

          echo "APK: $out (from $src)"
          ls -lh "$GITHUB_WORKSPACE/dist/$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Android OSS ${{ steps.apk.outputs.version_name }}
          body: |
            Orange Cloud Android **OSS** 构建（`assembleOssRelease`）

            - versionName: `${{ steps.apk.outputs.version_name }}`
            - versionCode: `${{ steps.apk.outputs.version_code }}`
            - applicationId: `jiamin.chen.orangecloud.oss`
            - 无 Play Billing；Pro 全解锁
            - 未配置仓库签名密钥时为未签名包（安装前需自行签名，或开启「允许未知来源」后视 ROM 策略安装）

            默认已注入官方 OAuth Client ID；可用 Secrets / 手动运行输入覆盖。
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
