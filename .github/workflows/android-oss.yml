# 自动构建 Android OSS APK（productFlavor: oss）
# - push / PR 变更 apps/android 时构建并上传 Artifact
# - 打 tag（android-oss-v* 或 v*）时额外挂到 GitHub Release
# - 也可在 Actions 页手动触发；可选填 OAUTH_CLIENT_ID

name: Build OSS APK

on:
  push:
    branches: [main, master]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-oss.yml"
    tags:
      - "android-oss-v*"
      - "v*"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-oss.yml"
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: "可选：注入自建 OAUTH_CLIENT_ID（默认空，与本地 oss 风味一致）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble ossRelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: apps/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            if [ -n "${{ inputs.oauth_client_id }}" ]; then
              echo "OAUTH_CLIENT_ID=${{ inputs.oauth_client_id }}"
            elif [ -n "${{ secrets.OAUTH_CLIENT_ID }}" ]; then
              echo "OAUTH_CLIENT_ID=${{ secrets.OAUTH_CLIENT_ID }}"
            fi
          } > local.properties

      - name: Build OSS release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOssRelease --stacktrace --no-daemon

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/oss/release -name '*.apk' -type f | head -n 1)"
          if [ -z "$src" ]; then
            echo "::error::未找到 oss release APK"
            exit 1
          fi

          version_name="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          version_code="$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=\s*([0-9]+).*/\1/')"
          out="orange-cloud-oss-${version_name}-${version_code}.apk"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$src" "$GITHUB_WORKSPACE/dist/$out"

          {
            echo "path=dist/$out"
            echo "name=$out"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

          echo "APK: $out (from $src)"
          ls -lh "$GITHUB_WORKSPACE/dist/$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Android OSS ${{ steps.apk.outputs.version_name }}
          body: |
            Orange Cloud Android **OSS** 构建（`assembleOssRelease`）

            - versionName: `${{ steps.apk.outputs.version_name }}`
            - versionCode: `${{ steps.apk.outputs.version_code }}`
            - applicationId: `jiamin.chen.orangecloud.oss`
            - 无 Play Billing；Pro 全解锁
            - 未配置仓库签名密钥时为未签名包（安装前需自行签名，或开启「允许未知来源」后视 ROM 策略安装）

            自行注入 OAuth：在仓库 Secrets 设置 `OAUTH_CLIENT_ID`，或手动运行本 workflow 时填写输入项。
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
